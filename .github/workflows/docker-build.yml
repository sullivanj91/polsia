name: Docker Build & Smoke Test

on:
  push:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build Images + Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create minimal .env for CI
        run: |
          cat > .env << EOF
          ENVIRONMENT=ci
          API_KEY=smoke-test-key
          SANDBOX_MODE=true
          CLAUDE_CLI_MOCK=true
          POSTGRES_USER=polsia
          POSTGRES_PASSWORD=polsia_password
          POSTGRES_DB=polsia
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          CHROMA_PERSIST_DIR=/app/data/chroma
          STRIPE_SECRET_KEY=sk_test_fake
          STRIPE_WEBHOOK_SECRET=whsec_fake
          STRIPE_PUBLISHABLE_KEY=pk_test_fake
          EOF

      - name: Build all images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build
        timeout-minutes: 20

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
        timeout-minutes: 5

      - name: Wait for backend health
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost/api/v1/health; do sleep 2; done'

      - name: Verify all services are running
        run: |
          docker compose ps
          # Assert backend is up
          curl -sf http://localhost/api/v1/health | grep '"status":"ok"'

      - name: Tear down
        if: always()
        run: docker compose down -v
