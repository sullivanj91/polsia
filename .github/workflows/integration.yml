name: Integration & E2E Tests

on:
  push:
    branches: [main]

jobs:
  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run integration tests
        env:
          CLAUDE_CLI_MOCK: "true"
          SANDBOX_MODE: "true"
          API_KEY: "int-test-key"
          CHROMA_PERSIST_DIR: /tmp/chroma_int_test
        run: pytest tests/integration/ -v -m integration
        working-directory: backend

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create CI env file
        run: |
          cat > .env << EOF
          ENVIRONMENT=ci
          API_KEY=e2e-test-key
          SANDBOX_MODE=true
          CLAUDE_CLI_MOCK=true
          POSTGRES_USER=polsia
          POSTGRES_PASSWORD=polsia_password
          POSTGRES_DB=polsia
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          CHROMA_PERSIST_DIR=/app/data/chroma
          STRIPE_SECRET_KEY=sk_test_fake
          STRIPE_WEBHOOK_SECRET=whsec_fake
          EOF

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
        timeout-minutes: 10

      - name: Wait for health
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost/api/v1/health; do sleep 2; done'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2e
        env:
          BASE_URL: http://localhost
          API_KEY: e2e-test-key

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Tear down
        if: always()
        run: docker compose down
